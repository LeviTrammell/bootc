[package]
name = "niri-nav"
version = "0.1.0"
edition = "2021"

[features]
# Exactly one of these must be enabled. The default is `ogu` because that's
# the variant the crate originally targeted; HTPC builds pass
# `--no-default-features --features htpc`.
default = ["ogu"]
ogu = []
htpc = []

[dependencies]
cs-proto = { path = "../cs-proto" }

evdev = { version = "0.12", features = ["tokio"] }
async-trait = "0.1"

tokio = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
