[workspace]
resolver = "2"
members = [
    "cs-proto",
    "niri-nav",
    "controller-shell",
    "cursor-daemon",
]

# Shared dep versions so all three binaries pin the same versions and
# avoid duplicate compiles. Member crates use these via
# `serde = { workspace = true }` etc.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
