// OGU handheld defaults (854x480 gamepad-driven, PSP-style browsing)
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("zen.welcome-screen.seen", true);
defaultPref("browser.aboutwelcome.enabled", false);
// Compact mode: sidebar/tabbar hidden, full width for content on the
// tiny panel; hover the left edge to peek at tabs.
defaultPref("zen.view.compact.enable-at-startup", true);
defaultPref("zen.view.compact.show-sidebar-and-toolbar-on-hover", true);
// Hard poweroffs are normal on a handheld — skip the restore prompt.
defaultPref("browser.sessionstore.resume_from_crash", false);
