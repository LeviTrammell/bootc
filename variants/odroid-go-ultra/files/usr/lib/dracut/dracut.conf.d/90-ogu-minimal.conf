# Minimal initramfs for ODROID Go Ultra (Amlogic S922X, 2GB RAM)
#
# The vendor U-Boot loads the initrd at a FIXED 0x03080000 with no
# relocation. U-Boot's boot script area is at 0x04000000 (15.5MB above)
# and ARM Trusted Firmware is resident at 0x05000000 (31.5MB above) -
# a stock Fedora dracut initramfs (23-80MB) overruns these and kills
# the MIPI-DSI display. This config produces a ~12.6MB initramfs.
#
# All boot-critical drivers (MMC, ext4, vfat, DRM) are built into the
# custom kernel, so no kernel modules are needed (--no-kernel is passed
# on the dracut command line in the Containerfile).
#
# Verified against fedora-bootc:42 (see repo history for the test run):
# /init -> systemd, ostree-prepare-root.service + bootc-root-setup.service
# wired into initrd-root-fs.target.wants, composefs enabled.
hostonly=no
early_microcode=no
nofscks=yes
sysloglvl=0
compress="zstd -19"
do_strip=yes
reproducible=yes

# Explicit module list. NOTE: the fedora-bootc base image ships confs that
# force-add modules on top of this (20-bootc-base.conf: ostree/bootc - good;
# 30-bootc-standard.conf: lvm/crypt/fips; 49/50-*: tpm2-tss/clevis/
# nss-softokn; 22-bootc-generic.conf: virtiofs). add_dracutmodules beats
# dracutmodules, so the unwanted ones must be omitted below (omit wins).
dracutmodules=" bash systemd systemd-initrd dracut-systemd systemd-journald systemd-udevd systemd-sysctl systemd-tmpfiles udev-rules rootfs-block usrmount base fs-lib shutdown ostree bootc "
omit_dracutmodules+=" lvm crypt dm mdraid fips fips-crypto-policies clevis clevis-pin-tpm2 clevis-pin-sss clevis-pin-tang clevis-pin-null tpm2-tss nss-softokn virtiofs qemu qemu-net modsign plymouth resume i18n network terminfo hwdb lunmask btrfs xfs "

# Fedora's 01-dist.conf appends vi (1.7MB) via install_optional_items.
# Plain assignment (not +=) overrides the accumulated list - keep only
# the small emergency-shell tools.
install_optional_items=" ps grep cat rm "
