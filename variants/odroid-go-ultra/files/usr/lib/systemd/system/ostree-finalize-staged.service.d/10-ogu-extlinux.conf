# OGU: regenerate the U-Boot extlinux.conf on P1 right after ostree
# finalizes the staged deployment. Finalizing rewrites the BLS entries
# and flips the /ostree/boot.0 <-> boot.1 alternation, so an
# extlinux.conf generated any earlier points at a path that no longer
# exists and the next boot dies in ostree-prepare-root.
#
# This is a drop-in on ostree-finalize-staged.service itself (appending
# a second ExecStop) instead of a separate unit ordered against it:
# ExecStop lines within one unit run strictly in order, so the
# regeneration is guaranteed to run after the BLS flip — inter-unit
# stop ordering proved unreliable here (2026-07: a bootc switch
# finalized without the separate hook unit running, leaving a stale
# single-entry extlinux.conf and an unbootable system).
[Unit]
# P1 (FAT32, /boot/efi) must still be mounted when ExecStop runs.
RequiresMountsFor=/boot/efi

[Service]
ExecStop=/usr/local/bin/update-extlinux.sh
