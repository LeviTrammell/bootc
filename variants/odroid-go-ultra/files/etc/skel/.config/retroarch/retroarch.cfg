# RetroArch configuration for ODROID Go Ultra (S922X / Mali-G52)

# Video - Mali Vulkan for GPU-accelerated rendering
video_driver = "vulkan"
video_context_driver = "wayland"
video_fullscreen = "true"
video_vsync = "true"
video_max_swapchain_images = "2"

# Input - direct evdev for lowest latency under Wayland
input_driver = "udev"
input_joypad_driver = "udev"

# Audio
audio_driver = "alsa"
audio_latency = "64"

# Paths
libretro_directory = "/usr/lib64/libretro"
system_directory = "~/.config/retroarch/system"
savefile_directory = "~/.config/retroarch/saves"
savestate_directory = "~/.config/retroarch/states"

# Menu
menu_driver = "ozone"

# Performance
video_threaded = "true"

# Hotkeys - Select is the hotkey enable button, then Start quits
input_enable_hotkey_btn = "6"
input_exit_emulator_btn = "7"

# Quit RetroArch cleanly when closing (returns to ES-DE)
quit_press_twice = "false"
