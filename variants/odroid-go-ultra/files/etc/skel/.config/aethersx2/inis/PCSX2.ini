# AetherSX2 / PCSX2 settings tuned for S922X (Mali-G52, 2GB RAM)
# Based on ROCKNIX defaults for ODROID Go Ultra

[EmuCore/GS]
Renderer = 14
# Vulkan renderer (14 = Auto/Vulkan on ARM)
upscale_multiplier = 1
# Native resolution (480p) - S922X can't handle higher
texture_filtering = 0
# Nearest (fastest)
MaxAnisotropy = 0
conservative_framebuffer = 1
accurate_blending_unit = 0
# Basic blending (fastest)

[EmuCore/Speedhacks]
vuThread = 1
# VU1 on separate thread - critical for S922X performance
EECycleRate = 0
EECycleSkip = 0
fastCDVD = 1
IntcStat = 1
WaitLoop = 1
vuFlagHack = 1

[EmuCore]
EnableCheats = 0
EnableWideScreenPatches = 0

[UI]
ConfirmShutdown = 0
StartPaused = 0

[Folders]
Bios = ~/.config/aethersx2/bios
