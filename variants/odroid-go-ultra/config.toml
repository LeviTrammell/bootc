[[customizations.user]]
name = "levi"
key = "ssh-rsa  davidtrammell@Davids-MacBook-Pro.local"
groups = ["wheel", "render", "input", "video"]

# MBR partition table - required for Amlogic S922X because the FIP bootloader
# lives at sector 1 which conflicts with GPT's primary header
[customizations.disk]
type = "dos"

# P1: FAT32 boot partition - U-Boot reads kernel and extlinux.conf from here
# Type 0c = FAT32 LBA (required by vendor U-Boot)
[[customizations.disk.partitions]]
mountpoint = "/boot/efi"
fs_type = "vfat"
part_type = "0c"
minsize = "500 MiB"

# P2: /boot - ostree BLS entries and boot data
[[customizations.disk.partitions]]
mountpoint = "/boot"
fs_type = "ext4"
minsize = "1 GiB"

# P3: root filesystem
[[customizations.disk.partitions]]
mountpoint = "/"
fs_type = "ext4"
minsize = "3500 MiB"

# clk_ignore_unused is CRITICAL for Amlogic Meson G12B - boot hangs without it
[customizations.kernel]
append = "clk_ignore_unused console=ttyAML0,115200n8 console=tty0 no_console_suspend"
