---
version: 3

vars:
  BOOTC_IMAGE_TYPE: raw
  ROOTFS: xfs

tasks:
  bootc-image-builder:
    internal: true
    requires:
      vars: [IMAGE, BOOTC_IMAGE_TYPE, ARCH, OUTDIR, CONFIG, BASE_REPO]
    cmds:
      - cmd: mkdir -p ./{{.OUTDIR}}
      - cmd: >
          podman run --rm -it --privileged
          --security-opt label=type:unconfined_t
          -v $(pwd)/{{.CONFIG}}:/config.toml:ro
          -v $(pwd)/{{.OUTDIR}}:/output
          -v /var/lib/containers/storage:/var/lib/containers/storage
          --pull=newer
          --platform linux/{{.ARCH}}
          quay.io/centos-bootc/bootc-image-builder:latest
          --target-arch {{.ARCH}}
          --type {{.BOOTC_IMAGE_TYPE}}
          --rootfs {{.ROOTFS}}
          {{.BASE_REPO}}/{{.IMAGE}}

  pi:
    cmd:
      task: bootc-image-builder
      vars:
        ARCH: aarch64
        IMAGE: pi
        ROOTFS: ext4
        OUTDIR: dist/pi
        CONFIG: variants/streampi/config.toml

  odroid-go-ultra:
    cmd:
      task: bootc-image-builder
      vars:
        ARCH: aarch64
        IMAGE: odroid-go-ultra
        ROOTFS: ext4
        OUTDIR: dist/odroid-go-ultra
        CONFIG: variants/odroid-go-ultra/config.toml

  odroid-go-ultra-complete:
    desc: Build complete OGU image (kernel + bootloader + disk image, ready to flash)
    deps: [odroid-go-ultra]
    cmds:
      - bash variants/odroid-go-ultra/scripts/create-full-image.sh

  pi-pr935:
    desc: Build Raspberry Pi disk image using bootupd PR #935 (test variant, Fedora 43)
    cmd:
      task: bootc-image-builder
      vars:
        ARCH: aarch64
        IMAGE: pi-pr935
        ROOTFS: ext4
        OUTDIR: dist/pi-pr935
        CONFIG: variants/pi-pr935/config.toml

  beelink-t4:
    desc: Build Beelink T4 x86_64 bootable ISO
    cmd:
      task: bootc-image-builder
      vars:
        ARCH: x86_64
        IMAGE: beelink-t4
        BOOTC_IMAGE_TYPE: iso
        ROOTFS: ext4
        OUTDIR: dist/beelink-t4
        CONFIG: variants/beelink-t4/config.toml
