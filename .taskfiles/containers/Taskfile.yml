---
version: 3

tasks:
  build:
    internal: true
    requires:
      vars: [FILE, TAG, ARCH, FEDORA_MAJOR_VERSION, BASE_REPO]
    cmd: >
      podman build
      --platform linux/{{.ARCH}}
      --build-arg FEDORA_MAJOR_VERSION={{.FEDORA_MAJOR_VERSION}}
      --build-arg BASE_REPO={{.BASE_REPO}}
      -f {{.FILE}}
      -t {{.BASE_REPO}}/{{.TAG}}
      .

  pi:
    deps: []
    cmd:
      task: build
      vars:
        FILE: ./variants/pi/Containerfile
        TAG: pi

  odroid-go-ultra-kernel:
    desc: Build custom minimal kernel for Odroid Go Ultra (native arm64)
    cmd:
      task: build
      vars:
        FILE: ./variants/odroid-go-ultra/Containerfile.kernel
        TAG: odroid-go-ultra-kernel
        ARCH: arm64
        FEDORA_MAJOR_VERSION: 42

  odroid-go-ultra-uboot:
    desc: Build U-Boot bootloader container for Odroid Go Ultra
    cmd:
      task: build
      vars:
        FILE: ./variants/odroid-go-ultra/Containerfile.uboot
        TAG: odroid-go-ultra-uboot
        FEDORA_MAJOR_VERSION: 43

  odroid-go-ultra:
    desc: Build Odroid Go Ultra bootc image (depends on kernel + U-Boot containers)
    deps: [odroid-go-ultra-kernel, odroid-go-ultra-uboot]
    cmd:
      task: build
      vars:
        FILE: ./variants/odroid-go-ultra/Containerfile
        TAG: odroid-go-ultra
        FEDORA_MAJOR_VERSION: 42

  pi-pr935:
    desc: Build Raspberry Pi image using bootupd PR #935 (test variant, Fedora 43)
    deps: []
    cmd:
      task: build
      vars:
        FILE: ./variants/pi-pr935/Containerfile
        TAG: pi-pr935
        FEDORA_MAJOR_VERSION: 43

  beelink-t4:
    desc: Build Beelink T4 x86_64 headless dev box for unikernel development
    deps: []
    cmd:
      task: build
      vars:
        FILE: ./variants/beelink-t4/Containerfile
        TAG: beelink-t4
        ARCH: x86_64
